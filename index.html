<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit a phone screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NouillesApp</title>

  <!-- PWA bits: manifest = "install me" info, theme-color = browser bar color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b2b3a">

  <!-- Free pixel font for titles (falls back to monospace if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Small status line: "synced", "offline", or "local mode" -->
    <p id="status">starting...</p>

    <!-- SCREEN 1: Home. One big tile per feature. -->
    <section id="home">
      <h1><span class="app-logo" aria-hidden="true"></span>NouillesApp</h1>
      <!-- A link to #courses: app.js shows the Courses screen when the address ends in #courses -->
      <!-- Main feature tile: a fixed 160x90 picture, with the name as real text BELOW it -->
      <a class="feature-tile courses" href="#courses">
        <span class="feature-art"></span>
        <span class="feature-label">Courses</span>
      </a>
      <!-- Stand-in for the next feature: same fixed 160x90 shape, not a link yet -->
      <div class="feature-tile soon">
        <span class="feature-art"></span>
        <span class="feature-label">soon</span>
      </div>
    </section>

    <!-- SCREEN 2: Courses (the shopping list) -->
    <section id="courses" hidden>
      <header>
        <a id="back" href="#home" aria-label="Back to home">&lt;</a>
        <h1>Courses</h1>
      </header>

      <!-- The list. app.js fills this with one <li> per item that is not done -->
      <ul id="list"></ul>
      <p id="empty" hidden>Nothing to buy yet.</p>

      <!-- Bar that appears for ~4 seconds after you tick an item -->
      <div id="undo-bar" class="bar" hidden>
        <span id="undo-text"></span>
        <button id="undo-btn" type="button">Undo</button>
      </div>

      <!-- Add form: hidden until you tap the big + -->
      <form id="add-form" autocomplete="off" hidden>
        <input id="new-item" type="text" placeholder="PQ, lait..." maxlength="80" required>
        <button id="add-ok" type="submit" aria-label="Add item"></button>
      </form>

      <!-- The big + button at the bottom -->
      <button id="big-add" type="button" aria-label="Add an item">+</button>
    </section>
  </main>

  <!-- Order matters: the Supabase library, then our files -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
